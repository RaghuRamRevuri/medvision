services:
  # FastAPI Python Backend Web Service
  - type: web
    name: medvision-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    healthCheckPath: /

  # Vite React Frontend Static Site (Render CDN)
  - type: web
    name: medvision-frontend
    runtime: static
    buildCommand: "npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
